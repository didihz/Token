<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token System — Schule</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:wght@300;400;500&display=swap');
:root {
  --bg:#0F0F0F;--surface:#1A1A1A;--card:#222;--border:#2E2E2E;
  --gold:#FBBF24;--text:#F5F5F0;--muted:#666;--soft:#3A3A3A;
  --n1:#4ADE80;--n2:#86EFAC;--n3:#FDE68A;--n4:#FDBA74;--n5:#F87171;--n6:#EF4444;
  --b1:#1A3D26;--b2:#1C3320;--b3:#2D2A10;--b4:#2D1E10;--b5:#3D1A1A;--b6:#3D0F0F;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Instrument Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}
#loadingScreen{align-items:center;justify-content:center;gap:16px;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-label{color:var(--muted);font-size:0.85rem;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:50;gap:10px;}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
.topbar h2{font-family:'Syne',sans-serif;font-size:0.95rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-right{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.sync-dot.live{background:var(--n1);animation:blink 2.5s infinite;}
.sync-dot.error{background:var(--n6);}
@keyframes blink{0%,100%{opacity:1}60%{opacity:0.3}}
.small-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-family:'Instrument Sans',sans-serif;font-size:0.73rem;color:var(--muted);cursor:pointer;transition:color 0.15s,border-color 0.15s;white-space:nowrap;}
.small-btn:hover{color:var(--text);border-color:var(--soft);}
#classScreen{padding:28px 16px 60px;}
#classScreen h1{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px;}
.sub{color:var(--muted);font-size:0.85rem;margin-bottom:28px;}
.class-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.class-card{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:18px 16px 14px;cursor:pointer;transition:border-color 0.15s,transform 0.1s;position:relative;-webkit-tap-highlight-color:transparent;}
.class-card:hover{border-color:var(--gold);}
.class-card:active{transform:scale(0.97);}
.cc-name{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:700;margin-bottom:4px;}
.cc-count{font-size:0.75rem;color:var(--muted);margin-bottom:8px;}
.cc-avg{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;}
.cc-del{position:absolute;top:10px;right:12px;font-size:0.72rem;color:var(--border);cursor:pointer;padding:4px;transition:color 0.15s;}
.cc-del:hover{color:var(--n6);}
.add-class-btn{width:100%;border:1.5px dashed var(--border);background:transparent;border-radius:18px;padding:18px;color:var(--muted);font-family:'Instrument Sans',sans-serif;font-size:0.88rem;cursor:pointer;transition:all 0.15s;}
.add-class-btn:hover{border-color:var(--gold);color:var(--gold);}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);}
.modal-backdrop.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:28px 20px 40px;width:100%;max-width:500px;animation:slideUp 0.25s ease;}
@keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal h3{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:800;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);display:block;margin-bottom:6px;font-weight:500;}
.field input,.field textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font-family:'Instrument Sans',sans-serif;font-size:0.88rem;outline:none;transition:border-color 0.15s;}
.field input:focus,.field textarea:focus{border-color:var(--gold);}
.field textarea{resize:vertical;min-height:130px;line-height:1.7;}
.modal-actions{display:flex;gap:8px;margin-top:20px;}
.btn-primary{flex:1;background:var(--gold);color:#0F0F0F;border:none;border-radius:12px;padding:12px;font-family:'Syne',sans-serif;font-size:0.92rem;font-weight:700;cursor:pointer;}
.btn-cancel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-family:'Instrument Sans',sans-serif;font-size:0.85rem;color:var(--muted);cursor:pointer;}
.grid-wrap{padding:14px 12px 90px;overflow-y:auto;flex:1;}
.students-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:9px;}
.student-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:13px 7px 10px;text-align:center;cursor:pointer;transition:all 0.15s;-webkit-tap-highlight-color:transparent;user-select:none;}
.student-card:active{transform:scale(0.92);}
.student-card.flash{animation:flashCard 0.4s ease;}
@keyframes flashCard{0%{transform:scale(1.1)}100%{transform:scale(1)}}
.s-avatar{width:36px;height:36px;border-radius:50%;background:var(--soft);margin:0 auto 7px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:0.95rem;font-weight:700;color:var(--muted);}
.s-name{font-size:0.7rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;}
.s-tisch{font-size:0.62rem;color:var(--muted);margin-bottom:5px;}
.s-note{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;line-height:1;}
.s-count{font-size:0.65rem;color:var(--muted);margin-top:2px;}
#notePicker{display:none;position:fixed;inset:0;z-index:150;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);align-items:flex-end;justify-content:center;}
#notePicker.open{display:flex;}
.picker-box{background:var(--surface);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:24px 20px 40px;width:100%;max-width:400px;animation:slideUp 0.22s ease;}
.picker-name{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;margin-bottom:4px;}
.picker-tisch{font-size:0.78rem;color:var(--muted);margin-bottom:18px;}
.notes-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px;}
.note-btn{border:none;border-radius:14px;padding:16px 0;font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;cursor:pointer;transition:transform 0.1s;}
.note-btn:active{transform:scale(0.92);}
.note-btn[data-note="1"]{background:var(--b1);color:var(--n1);}
.note-btn[data-note="2"]{background:var(--b2);color:var(--n2);}
.note-btn[data-note="3"]{background:var(--b3);color:var(--n3);}
.note-btn[data-note="4"]{background:var(--b4);color:var(--n4);}
.note-btn[data-note="5"]{background:var(--b5);color:var(--n5);}
.note-btn[data-note="6"]{background:var(--b6);color:var(--n6);}
.notiz-row{display:flex;gap:8px;}
.notiz-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 13px;color:var(--text);font-family:'Instrument Sans',sans-serif;font-size:0.85rem;outline:none;}
.notiz-input:focus{border-color:var(--gold);}
.notiz-skip{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:0.8rem;cursor:pointer;}
.panel-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;padding:20px 16px 40px;overflow-y:auto;backdrop-filter:blur(4px);}
.panel-backdrop.open{display:block;}
.panel-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;max-width:460px;margin:0 auto;}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.panel-header h3{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:800;}
.close-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;width:30px;height:30px;color:var(--muted);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.section-head{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin:14px 0 6px;}
.ov-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:0.83rem;}
.ov-row:last-child{border-bottom:none;}
.ov-name{font-weight:500;}
.ov-sub{font-size:0.7rem;color:var(--muted);margin-top:1px;}
.ov-note{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-12px);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:30px;font-size:0.8rem;font-weight:500;opacity:0;transition:all 0.2s;z-index:300;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="loadingScreen" class="screen active">
  <div class="spinner"></div>
  <span class="loading-label">Lade Klassen aus Sheet…</span>
</div>

<div id="classScreen" class="screen">
  <div style="padding:28px 16px 0">
    <h1>🏫 Klassen</h1>
    <p class="sub">Tippe auf eine Klasse → Schüler:in → Note vergeben</p>
  </div>
  <div style="padding:12px 16px 60px">
    <div class="class-grid" id="classGrid"></div>
    <button class="add-class-btn" onclick="openNewClass()">＋ Neue Klasse anlegen</button>
  </div>
</div>

<div id="classView" class="screen">
  <div class="topbar">
    <div class="topbar-left">
      <button class="small-btn" onclick="goBack()">← Klassen</button>
      <h2 id="viewTitle"></h2>
    </div>
    <div class="topbar-right">
      <div class="sync-dot live" id="syncDot"></div>
      <button class="small-btn" onclick="showOverview()">Übersicht</button>
    </div>
  </div>
  <div style="padding:10px 16px 6px;border-bottom:1px solid var(--border);font-size:0.75rem;color:var(--muted);">
    Schüler:in antippen → Note 1–6 vergeben
  </div>
  <div class="grid-wrap">
    <div class="students-grid" id="studentsGrid"></div>
  </div>
</div>

<div class="modal-backdrop" id="newClassModal">
  <div class="modal">
    <h3>Neue Klasse</h3>
    <div class="field">
      <label>Klassenname (z.B. 8a)</label>
      <input id="newClassName" placeholder="8a" maxlength="20"/>
    </div>
    <div class="field">
      <label>Vornamen — einer pro Zeile</label>
      <textarea id="newClassNames" placeholder="Anna&#10;Ben&#10;Clara&#10;…"></textarea>
    </div>
    <div class="field">
      <label>Tische optional — Name:Tisch pro Zeile</label>
      <textarea id="newClassTische" placeholder="Anna:Tisch 1&#10;Ben:Tisch 1&#10;…" style="min-height:80px"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeNewClass()">Abbrechen</button>
      <button class="btn-primary" onclick="createClass()">Anlegen →</button>
    </div>
  </div>
</div>

<div id="notePicker">
  <div class="picker-box">
    <div class="picker-name" id="pickerName"></div>
    <div class="picker-tisch" id="pickerTisch"></div>
    <div class="notes-row">
      <button class="note-btn" data-note="1" onclick="submitNote(1)">1</button>
      <button class="note-btn" data-note="2" onclick="submitNote(2)">2</button>
      <button class="note-btn" data-note="3" onclick="submitNote(3)">3</button>
      <button class="note-btn" data-note="4" onclick="submitNote(4)">4</button>
      <button class="note-btn" data-note="5" onclick="submitNote(5)">5</button>
      <button class="note-btn" data-note="6" onclick="submitNote(6)">6</button>
    </div>
    <div class="notiz-row">
      <input class="notiz-input" id="notizInput" placeholder="Kurze Notiz (optional)…" maxlength="100"/>
      <button class="notiz-skip" onclick="closePicker()">Abbrechen</button>
    </div>
    <div id="undoRow" style="margin-top:12px;display:none;">
      <button onclick="undoLastNote()" style="width:100%;background:var(--b5);border:1px solid var(--n5);border-radius:12px;padding:11px;color:var(--n5);font-family:Syne,sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;">
        ↩ Letzte Note löschen (war: <span id="lastNoteLabel"></span>)
      </button>
    </div>
  </div>
</div>

<div class="panel-backdrop" id="overviewPanel" onclick="panelBgClick(event)">
  <div class="panel-box">
    <div class="panel-header">
      <h3>📊 Notenübersicht</h3>
      <button class="close-btn" onclick="hideOverview()">✕</button>
    </div>
    <div id="overviewContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxfE4KaHfdsvG1dv63EveKyTpxcqRxus8nlg9B9XzH4S_xG67Zw6menRzW10aC8jlCPeA/exec';

const NOTE_COLORS = {1:'var(--n1)',2:'var(--n2)',3:'var(--n3)',4:'var(--n4)',5:'var(--n5)',6:'var(--n6)'};
const NOTE_BG     = {1:'var(--b1)',2:'var(--b2)',3:'var(--b3)',4:'var(--b4)',5:'var(--b5)',6:'var(--b6)'};

let classes = {};
let currentClassId = null;
let pickerStudent  = null;

// ── REMOTE ───────────────────────────────────────
async function remoteGet(params) {
  try {
    const url = SCRIPT_URL + '?' + new URLSearchParams(params).toString();
    const r = await fetch(url);
    return await r.json();
  } catch(e) { setSyncDot('error'); return null; }
}

async function remoteSend(params) {
  try {
    const url = SCRIPT_URL + '?' + new URLSearchParams(params).toString();
    await fetch(url, { mode: 'no-cors' });
    setSyncDot('live');
  } catch(e) { setSyncDot('error'); }
}

// ── KLASSEN LADEN ─────────────────────────────────
async function loadClasses() {
  const data = await remoteGet({ action: 'loadKlassen' });
  if (data && data.classes) {
    // Noten aus localStorage wiederherstellen
    const saved = JSON.parse(localStorage.getItem('token_noten_v1') || '{}');
    Object.entries(data.classes).forEach(([id, cls]) => {
      cls.students.forEach(s => {
        const key = id + '_' + s.name;
        s.noten = saved[key] || [];
      });
    });
    classes = data.classes;
  }
}

// ── NOTEN LOKAL SPEICHERN ─────────────────────────
function saveNotenLocal() {
  const saved = {};
  Object.entries(classes).forEach(([id, cls]) => {
    cls.students.forEach(s => {
      if ((s.noten||[]).length) saved[id + '_' + s.name] = s.noten;
    });
  });
  localStorage.setItem('token_noten_v1', JSON.stringify(saved));
}

// ── SCREENS ───────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── INIT ──────────────────────────────────────────
async function init() {
  await loadClasses();
  show('classScreen');
  renderClassList();
}

// ── HELPERS ───────────────────────────────────────
function avgNote(students) {
  const all = students.flatMap(s => s.noten||[]);
  return all.length ? (all.reduce((a,b)=>a+b,0)/all.length).toFixed(1) : null;
}
function noteColor(n) {
  if (!n) return 'var(--muted)';
  return NOTE_COLORS[Math.min(6,Math.max(1,Math.round(n)))];
}
function noteBg(n) {
  if (!n) return 'var(--soft)';
  return NOTE_BG[Math.min(6,Math.max(1,Math.round(n)))];
}

// ── CLASS LIST ────────────────────────────────────
function renderClassList() {
  const grid = document.getElementById('classGrid');
  const entries = Object.entries(classes);
  if (!entries.length) {
    grid.innerHTML='<p style="color:var(--muted);font-size:0.85rem;grid-column:span 2;padding:4px 0">Noch keine Klassen angelegt.</p>';
    return;
  }
  grid.innerHTML='';
  entries.forEach(([id,cls]) => {
    const avg = avgNote(cls.students||[]);
    const total = (cls.students||[]).reduce((s,st)=>s+(st.noten||[]).length,0);
    const card = document.createElement('div');
    card.className='class-card';
    card.innerHTML=`
      <span class="cc-del" onclick="deleteClass(event,'${id}')">✕</span>
      <div class="cc-name">${cls.name}</div>
      <div class="cc-count">${(cls.students||[]).length} Schüler:innen · ${total} Noten</div>
      <div class="cc-avg" style="color:${noteColor(avg)}">${avg?'⌀ '+avg:'—'}</div>`;
    card.addEventListener('click',()=>openClass(id));
    grid.appendChild(card);
  });
}

function openClass(id) {
  currentClassId=id;
  document.getElementById('viewTitle').textContent=classes[id].name;
  renderGrid();
  show('classView');
}

function goBack() {
  currentClassId=null;
  show('classScreen');
  renderClassList();
}

// ── NEW CLASS ─────────────────────────────────────
function openNewClass() {
  ['newClassName','newClassNames','newClassTische'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('newClassModal').classList.add('open');
  setTimeout(()=>document.getElementById('newClassName').focus(),80);
}
function closeNewClass() { document.getElementById('newClassModal').classList.remove('open'); }

async function createClass() {
  const name = document.getElementById('newClassName').value.trim();
  if (!name) { document.getElementById('newClassName').focus(); return; }
  const tischMap = {};
  document.getElementById('newClassTische').value.split('\n').forEach(line=>{
    const [n,t]=line.split(':').map(s=>s.trim());
    if(n&&t) tischMap[n]=t;
  });
  const students = document.getElementById('newClassNames').value
    .split('\n').map(n=>n.trim()).filter(Boolean)
    .map(n=>({name:n,tisch:tischMap[n]||'',noten:[]}));

  const id = 'cls_'+Date.now();
  classes[id]={name,students};
  closeNewClass();
  renderClassList();
  showToast('Klasse wird gespeichert…');

  // Im Sheet speichern
  await remoteSend({
    action: 'saveKlasse',
    id, name,
    students: encodeURIComponent(JSON.stringify(students.map(s=>({name:s.name,tisch:s.tisch}))))
  });
  showToast('✓ Klasse gespeichert');
  openClass(id);
}

async function deleteClass(e, id) {
  e.stopPropagation();
  if (!confirm(`Klasse "${classes[id]?.name}" löschen?`)) return;
  delete classes[id];
  renderClassList();
  await remoteSend({ action: 'deleteKlasse', id });
}

// ── STUDENT GRID ──────────────────────────────────
function renderGrid() {
  const students = classes[currentClassId]?.students||[];
  const grid = document.getElementById('studentsGrid');
  grid.innerHTML='';
  students.forEach((s,i)=>{
    const noten=s.noten||[];
    const avg=noten.length?(noten.reduce((a,b)=>a+b,0)/noten.length).toFixed(1):null;
    const card=document.createElement('div');
    card.id='sc'+i;
    card.className='student-card';
    card.innerHTML=`
      <div class="s-avatar" style="background:${noteBg(avg)};color:${noteColor(avg)}">${s.name.charAt(0)}</div>
      <div class="s-name">${s.name}</div>
      ${s.tisch?`<div class="s-tisch">${s.tisch}</div>`:''}
      <div class="s-note" style="color:${noteColor(avg)}">${avg?'⌀ '+avg:'·'}</div>
      <div class="s-count">${noten.length?noten.length+'×':''}</div>`;
    card.addEventListener('click',()=>openPicker(i));
    grid.appendChild(card);
  });
}

// ── NOTE PICKER ───────────────────────────────────
function openPicker(idx) {
  const s=classes[currentClassId].students[idx];
  pickerStudent={idx};
  document.getElementById('pickerName').textContent=s.name;
  document.getElementById('pickerTisch').textContent=s.tisch||'';
  document.getElementById('notizInput').value='';
  // Undo-Button anzeigen wenn Noten vorhanden
  const noten=s.noten||[];
  const undoRow=document.getElementById('undoRow');
  if(noten.length>0){
    document.getElementById('lastNoteLabel').textContent=noten[noten.length-1];
    undoRow.style.display='block';
  } else {
    undoRow.style.display='none';
  }
  document.getElementById('notePicker').classList.add('open');
}
function closePicker() { document.getElementById('notePicker').classList.remove('open'); pickerStudent=null; }

async function undoLastNote() {
  if (!pickerStudent) return;
  const s=classes[currentClassId].students[pickerStudent.idx];
  if(!(s.noten||[]).length) return;
  const removed=s.noten.pop();
  saveNotenLocal();
  closePicker();
  renderGrid();
  showToast(`↩ Note ${removed} bei ${s.name} gelöscht`);
  // Letzte Zeile im Sheet löschen
  await remoteSend({
    action: 'deleteLastNote',
    schueler: s.name,
    klasseName: classes[currentClassId].name
  });
}

async function submitNote(note) {
  if (!pickerStudent) return;
  const s=classes[currentClassId].students[pickerStudent.idx];
  const notiz=document.getElementById('notizInput').value.trim();
  s.noten=[...(s.noten||[]),note];
  saveNotenLocal();
  closePicker();
  const card=document.getElementById('sc'+pickerStudent?.idx);
  if(card){card.classList.add('flash');setTimeout(()=>card.classList.remove('flash'),400);}
  renderGrid();
  showToast(`${s.name} → Note ${note}${notiz?' · '+notiz:''}`);
  await remoteSend({
    action:'saveNote',
    tisch:s.tisch||'',
    schueler:s.name,
    note,
    notiz
  });
}

// ── OVERVIEW ──────────────────────────────────────
function showOverview() {
  const students=classes[currentClassId]?.students||[];
  const sorted=[...students].sort((a,b)=>{
    const aA=(a.noten||[]).length?(a.noten.reduce((x,y)=>x+y,0)/a.noten.length):99;
    const bB=(b.noten||[]).length?(b.noten.reduce((x,y)=>x+y,0)/b.noten.length):99;
    return aA-bB;
  });
  const with_n=sorted.filter(s=>(s.noten||[]).length>0);
  const without=sorted.filter(s=>!(s.noten||[]).length);
  let html='';
  if(with_n.length){
    html+='<div class="section-head">Alle benoteten Schüler:innen</div>';
    with_n.forEach(s=>{
      const avg=(s.noten.reduce((a,b)=>a+b,0)/s.noten.length).toFixed(1);
      html+=`<div class="ov-row"><div><div class="ov-name">${s.name}</div><div class="ov-sub">${s.tisch||''} · ${s.noten.length} Noten: ${s.noten.join(', ')}</div></div><div class="ov-note" style="color:${noteColor(avg)}">⌀ ${avg}</div></div>`;
    });
  }
  if(without.length){
    html+='<div class="section-head">· Noch keine Note</div>';
    without.forEach(s=>{html+=`<div class="ov-row"><div class="ov-name">${s.name}</div><div class="ov-note" style="color:var(--muted)">—</div></div>`;});
  }
  document.getElementById('overviewContent').innerHTML=html||'<p style="color:var(--muted);font-size:0.85rem">Noch keine Noten vergeben.</p>';
  document.getElementById('overviewPanel').classList.add('open');
}
function hideOverview(){document.getElementById('overviewPanel').classList.remove('open');}
function panelBgClick(e){if(e.target===document.getElementById('overviewPanel'))hideOverview();}

function setSyncDot(s){const d=document.getElementById('syncDot');if(d)d.className='sync-dot '+s;}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show';
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

init();
</script>
